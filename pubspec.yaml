name: guidy_audio_guide
description: Guidy - QR·BLE 비콘 연동 오디오 가이드 앱 (3채널 마켓플레이스)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  audioplayers: ^6.4.0
  url_launcher: 6.3.1
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/
  # Noto Sans KR 가변 글꼴(OFL) 일부 — 자주 쓰는 한글 2,350자·영문·기호. 다시 만들기: tool/font_subset_chars.py
  # 빠진 글자는 기기 글꼴(웹은 Google 글꼴 서버)로 대신 표시됨
  fonts:
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR-Subset.ttf
