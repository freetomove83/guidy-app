name: guidy_audio_guide
description: Guidy - QR·BLE 비콘 연동 오디오 가이드 앱 (3채널 마켓플레이스)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: 6.1.5+1
  http: 1.5.0
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  google_fonts: 6.2.1
  cached_network_image: 3.4.1
  flutter_svg: 2.0.10+1
  audioplayers: ^6.4.0
  percent_indicator: 4.2.4
  shimmer: 3.0.0
  intl: 0.20.2
  go_router: 15.1.2
  url_launcher: 6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/audio/
